# /etc/nginx/sites-available/genzhub — reverse proxy + TLS termination
server {
  listen 80;
  server_name genzhub.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name genzhub.example.com;

  ssl_certificate     /etc/letsencrypt/live/genzhub.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/genzhub.example.com/privkey.pem;

  client_max_body_size 30M;          # matches the 25 MB upload limit
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /uploads/ {
    proxy_pass http://127.0.0.1:3000;
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
