# Fly.io deployment — fly launch --no-deploy && fly volumes create genzhub_data --size 3 && fly deploy
app = "genz-hub"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/data"

[[mounts]]
  source = "genzhub_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # ঘুমানোর কনফিগ: কেউ না থাকলে মেশিন থামে, রিকোয়েস্ট এলে নিজে থেকে জেগে ওঠে (~3-5s)
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    X-Robots-Tag = "all"

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"
