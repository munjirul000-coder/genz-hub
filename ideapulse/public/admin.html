<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="meta.title.admin">Admin Dashboard — IdeaPulse</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="admin-body" data-page="admin">
  <nav class="admin-nav">
    <div class="container admin-nav-inner">
      <a class="brand" href="/admin/dashboard">
        <span class="logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 13a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M12 13V5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="15.5" r="1.6" fill="currentColor"/></svg>
        </span>
        IdeaPulse <span style="font-weight:600;color:var(--muted);font-size:0.85rem;">· Admin</span>
      </a>
      <div class="nav-actions">
        <span class="mono" id="admin-email" style="color:var(--muted);"></span>
        <button class="lang-toggle" type="button" data-lang-toggle aria-label="Switch language">বাংলা</button>
        <a href="/" style="font-weight:600;font-size:0.9rem;" data-i18n="admin.viewsite">View site</a>
        <button class="btn btn-ghost btn-sm" id="logout-btn" data-i18n="admin.logout">Log out</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="layout">
      <aside class="sidebar">
        <button data-nav="overview" class="active">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="2"/></svg>
          <span data-i18n="nav.overview">Overview</span>
        </button>
        <button data-nav="submissions">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          <span data-i18n="nav.submissions">Submissions</span>
        </button>
        <button data-nav="opportunities">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span data-i18n="nav.opportunities">Opportunities</span>
        </button>
        <button data-nav="analytics">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 20V10M10 20V4M16 20v-6M22 20H2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <span data-i18n="nav.analytics">Analytics</span>
        </button>
      </aside>

      <main class="main" id="view">
        <div class="empty"><span class="spinner" style="border-color:rgba(124,58,237,.3);border-top-color:#7c3aed;"></span><p data-i18n="common.loading">Loading…</p></div>
      </main>
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/ideapulse.js"></script>
</body>
</html>
