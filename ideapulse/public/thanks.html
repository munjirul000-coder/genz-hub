<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="meta.title.thanks">Thank you for sharing — IdeaPulse</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="container" style="display:flex;justify-content:flex-end;padding-top:20px;">
    <button class="lang-toggle" type="button" data-lang-toggle aria-label="Switch language">বাংলা</button>
  </div>
  <main class="success-hero">
    <div class="container">
      <div class="success-ring">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1><span data-i18n="thanks.title.a">Thank you for</span> <span class="grad-text" data-i18n="thanks.title.b">sharing.</span></h1>
      <p class="subhead" style="margin:0 auto 30px;" data-i18n="thanks.body">Your response has been securely recorded and may help us understand what people really need.</p>
      <div style="display:flex; gap:14px; justify-content:center; flex-wrap:wrap;">
        <a class="btn btn-primary btn-lg" href="/submit" data-i18n="thanks.again">Share Another Problem</a>
        <a class="btn btn-ghost btn-lg" href="/" data-i18n="thanks.home">Back to Home</a>
      </div>
    </div>
  </main>
  <script src="/js/i18n.js"></script>
</body>
</html>
