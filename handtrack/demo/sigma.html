<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGMA CAMERA - 4 Kona Grid</title>
<style>
  :root{--bg:#05060a;--card:#0d1017;--line:#1c2230;--ink:#f2f4f8;--mut:#8b94a7;--grn:#22ff88;--red:#fe2c55;--cyn:#39d5ff;--gold:#ffd23f}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,'Segoe UI',sans-serif;overflow:hidden}
  /* ---------- top bar ---------- */
  .top{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 14px;
       background:linear-gradient(180deg,rgba(5,6,10,.92),rgba(5,6,10,.55) 70%,transparent);pointer-events:none}
  .top *{pointer-events:auto}
  .logo{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:2px}
  .logo .sig{color:var(--gold);font-size:20px}
  .rec{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--red)}
  .rec .d{width:9px;height:9px;border-radius:50%;background:var(--red);animation:blink 1.1s infinite}
  @keyframes blink{50%{opacity:.15}}
  .top .sp{flex:1}
  .btn{appearance:none;border:1px solid var(--line);background:#12161f;color:var(--ink);padding:8px 13px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
  .btn:hover{border-color:#33405c}
  .btn.primary{background:var(--red);border-color:transparent}
  .btn.on{background:#0e2a1a;border-color:var(--grn);color:var(--grn)}
  /* ---------- 4-kona grid ---------- */
  .stage{position:fixed;inset:0}
  .grid{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;padding:6px}
  .cell{position:relative;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  .cell canvas,.cell video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cell .tag{position:absolute;left:10px;top:8px;z-index:5;font-size:11px;font-weight:800;letter-spacing:1.5px;color:#fff;
             background:rgba(0,0,0,.55);padding:3px 9px;border-radius:6px;backdrop-filter:blur(4px)}
  .cell .corner{position:absolute;width:26px;height:26px;border:3px solid var(--grn);z-index:4;opacity:0;transition:opacity .25s}
  .cell.locked .corner{opacity:1}
  .c-tl{left:8px;top:8px;border-right:0;border-bottom:0}
  .c-tr{right:8px;top:8px;border-left:0;border-bottom:0}
  .c-bl{left:8px;bottom:8px;border-right:0;border-top:0}
  .c-br{right:8px;bottom:8px;border-left:0;border-top:0}
  /* film-grain + vignette overlay per cell */
  .cell::after{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.42) 100%);}
  /* REC dot top-right of each cell */
  .cell .rd{position:absolute;right:10px;top:10px;z-index:5;display:none;align-items:center;gap:5px;font-size:10px;font-weight:800;color:var(--red)}
  .cell .rd i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1.1s infinite}
  body.rec-on .cell .rd{display:flex}
  /* ---------- start overlay ---------- */
  .gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(90% 90% at 50% 20%,#10131c,#05060a)}
  .gate .inner{text-align:center;max-width:520px;padding:24px}
  .gate h1{font-size:42px;font-weight:900;letter-spacing:4px;line-height:1.05}
  .gate h1 span{color:var(--gold)}
  .gate p{color:var(--mut);margin:14px 0 24px;font-size:14.5px}
  .gate .big{font-size:16px;padding:14px 26px;border-radius:12px}
  .gate .err{margin-top:14px;color:#fda4af;font-size:12.5px;white-space:pre-wrap;word-break:break-word}
  .gate .hint{margin-top:18px;font-size:12px;color:var(--mut)}
  .gate kbd{background:#161b26;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11px}
  /* ---------- bottom bar ---------- */
  .bot{position:fixed;inset:auto 0 0 0;z-index:50;display:flex;align-items:center;gap:8px;padding:10px 14px;justify-content:center;
       background:linear-gradient(0deg,rgba(5,6,10,.92),rgba(5,6,10,.5) 70%,transparent)}
  .stat{font-size:12px;color:var(--mut)}
  .stat b{color:var(--grn)}
  .fps{font-variant-numeric:tabular-nums}
  /* countdown flash */
  .flash{position:fixed;inset:0;z-index:90;pointer-events:none;background:#fff;opacity:0}
  .flash.go{animation:fl .5s ease}
  @keyframes fl{0%{opacity:.85}100%{opacity:0}}
  /* shot film-strip */
  .strip{position:fixed;right:12px;bottom:64px;z-index:60;display:flex;flex-direction:column;gap:8px}
  .strip img{width:130px;border-radius:10px;border:2px solid var(--grn);box-shadow:0 8px 24px rgba(0,0,0,.5)}
</style>
</head>
<body>

<div class="top">
  <div class="logo"><span class="sig">Σ</span> SIGMA CAMERA</div>
  <div class="rec" id="recBadge" style="display:none"><span class="d"></span>REC</div>
  <div class="sp"></div>
  <button class="btn" id="bShot">📸 Shot (S)</button>
  <button class="btn" id="bRec">⏺ Record (R)</button>
  <button class="btn on" id="bGrid">▦ 4 Kona</button>
  <button class="btn" id="bSolo">⛶ Full</button>
</div>

<div class="stage">
  <div class="grid" id="grid">
    <div class="cell" id="cell1"><video id="cam" playsinline muted autoplay></video><canvas id="cv1"></canvas>
      <span class="tag">RAW</span><span class="rd"><i></i>REC</span>
      <span class="corner c-tl"></span><span class="corner c-tr"></span><span class="corner c-bl"></span><span class="corner c-br"></span></div>
    <div class="cell" id="cell2"><canvas id="cv2"></canvas><span class="tag">SKELETON</span><span class="rd"><i></i>REC</span>
      <span class="corner c-tl"></span><span class="corner c-tr"></span><span class="corner c-bl"></span><span class="corner c-br"></span></div>
    <div class="cell" id="cell3"><canvas id="cv3"></canvas><span class="tag">FRAME LOCK</span><span class="rd"><i></i>REC</span>
      <span class="corner c-tl"></span><span class="corner c-tr"></span><span class="corner c-bl"></span><span class="corner c-br"></span></div>
    <div class="cell" id="cell4"><canvas id="cv4"></canvas><span class="tag">SIGMA MODE</span><span class="rd"><i></i>REC</span>
      <span class="corner c-tl"></span><span class="corner c-tr"></span><span class="corner c-bl"></span><span class="corner c-br"></span></div>
  </div>
</div>

<div class="bot">
  <span class="stat">🖐 hands: <b id="hNum">0</b></span>
  <span class="stat">🙂 faces: <b id="fNum">0</b></span>
  <span class="stat" id="lockStat">🔓 searching…</span>
  <span class="stat fps" id="fps"></span>
</div>

<div class="strip" id="strip"></div>
<div class="flash" id="flash"></div>

<div class="gate" id="gate">
  <div class="inner">
    <h1>SIGMA <span>CAMERA</span></h1>
    <p>4 kona ek sathe — RAW feed, hand skeleton, frame-lock tracking ar sigma mode.<br>
       Dui haat diye frame banao, mukher dike anaO — <b style="color:var(--grn)">LOCK!</b></p>
    <button class="btn primary big" id="bStart">▶ CAMERA ON</button>
    <div class="err" id="err"></div>
    <div class="hint">Keys: <kbd>S</kbd> shot · <kbd>R</kbd> record · <kbd>G</kbd> grid/full toggle</div>
  </div>
</div>

<script src="lib/hands/hands.js"></script>
<script src="lib/face_detection/face_detection.js"></script>
<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const cam = $('#cam'), gate = $('#gate'), errBox = $('#err');
  const cells = [$('#cell1'), $('#cell2'), $('#cell3'), $('#cell4')];
  const cvs = [$('#cv1'), $('#cv2'), $('#cv3'), $('#cv4')];
  const ctxs = cvs.map((c) => c.getContext('2d'));
  const hNum = $('#hNum'), fNum = $('#fNum'), lockStat = $('#lockStat'), fpsEl = $('#fps');
  const strip = $('#strip'), flash = $('#flash');

  const GRN = '#22ff88', CYN = '#39d5ff', WHT = '#fff', RED = '#fe2c55', GOLD = '#ffd23f';
  const state = { grid: true, solo: 0, rec: false, chunks: [], recOn: false, hands: [], faces: [], frame: null, locked: false, smooth: {} };

  /* ---------------- mediapipe (local models) ---------------- */
  let hands = null, face = null, ready = 0;
  function initModels() {
    hands = new Hands({ locateFile: (f) => 'lib/hands/' + f });
    hands.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
    hands.onResults((r) => { state.hands = r.multiHandLandmarks || []; if (!(ready & 1)) { ready |= 1; } });
    face = new FaceDetection({ locateFile: (f) => 'lib/face_detection/' + f });
    face.setOptions({ model: 'short', minDetectionConfidence: 0.55 });
    face.onResults((r) => { state.faces = r.detections || []; if (!(ready & 2)) { ready |= 2; } });
  }

  const mx = (x, W) => W - x * W;
  const my = (y, H) => y * H;
  const smooth = (k, v, a = 0.45) => {
    const p = state.smooth[k];
    const o = (p === undefined) ? v : p.map((pv, i) => a * v[i] + (1 - a) * pv);
    state.smooth[k] = o; return o;
  };
  const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

  function analyze(W, H) {
    const faces = state.faces.map((d) => {
      const bb = d.locationData.relativeBoundingBox;
      return { x1: mx(bb.xmin + bb.width, W), y1: my(bb.ymin, H), x2: mx(bb.xmin, W), y2: my(bb.ymin + bb.height, H), s: d.score[0] };
    });
    const handsPx = state.hands.map((lms) => lms.map((l) => ({ x: mx(l.x, W), y: my(l.y, H) })));
    let frame = null, locked = false;
    if (handsPx.length >= 2) {
      const tips = [];
      handsPx.slice(0, 2).forEach((pts) => { tips.push(pts[4], pts[8]); });
      const xs = tips.map((p) => p.x), ys = tips.map((p) => p.y);
      const x1 = Math.min(...xs) - 10, y1 = Math.min(...ys) - 10;
      const x2 = Math.max(...xs) + 10, y2 = Math.max(...ys) + 10;
      if (x2 - x1 > 80 && y2 - y1 > 60) {
        const a = smooth('f1', [x1, y1]), b = smooth('f2', [x2, y2]);
        frame = { x1: a[0], y1: a[1], x2: b[0], y2: b[1] };
      }
    } else if (handsPx.length === 1) {
      const pts = handsPx[0];
      const scale = dist(pts[0].x, pts[0].y, pts[9].x, pts[9].y) || 1;
      const d = dist(pts[4].x, pts[4].y, pts[8].x, pts[8].y);
      if (d < 0.32 * scale) {
        const side = Math.max(70, 2.4 * scale);
        const cx = (pts[4].x + pts[8].x) / 2, cy = (pts[4].y + pts[8].y) / 2;
        frame = { x1: cx - side / 2, y1: cy - side / 2, x2: cx + side / 2, y2: cy + side / 2 };
      }
    }
    if (frame && faces.length) {
      for (const f of faces) {
        const ey2 = f.y1 + (f.y2 - f.y1) / 2;
        const ix = Math.max(0, Math.min(frame.x2, f.x2) - Math.max(frame.x1, f.x1));
        const iy = Math.max(0, Math.min(frame.y2, ey2) - Math.max(frame.y1, f.y1));
        if ((ix * iy) / Math.max(1, (f.x2 - f.x1) * (ey2 - f.y1)) >= 0.30) { locked = true; break; }
      }
    }
    return { faces, handsPx, frame, locked };
  }

  const HC = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
              [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
  const DC = ['#fe2c55','#39d5ff','#22ff88','#ffd23f','#c084fc'];

  function drawSkeleton(ctx, det, W, H) {
    det.handsPx.forEach((pts) => {
      ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      for (const [a, b] of HC) { ctx.beginPath(); ctx.moveTo(pts[a].x, pts[a].y); ctx.lineTo(pts[b].x, pts[b].y); ctx.stroke(); }
      for (let i = 0; i < pts.length; i++) {
        ctx.beginPath(); ctx.arc(pts[i].x, pts[i].y, i % 4 === 0 ? 6 : 4, 0, 7);
        ctx.fillStyle = DC[Math.floor(i / 4) % 5]; ctx.fill();
      }
    });
    det.faces.forEach((f) => {
      ctx.strokeStyle = WHT; ctx.lineWidth = 2.5;
      ctx.strokeRect(f.x1, f.y1, f.x2 - f.x1, f.y2 - f.y1);
    });
  }

  function drawFrameLock(ctx, det, W, H) {
    ctx.drawImage(cv1, 0, 0);                        // base feed
    // dim outside the frame
    if (det.frame) {
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.beginPath();
      ctx.rect(0, 0, W, H);
      ctx.rect(det.frame.x1, det.frame.y1, det.frame.x2 - det.frame.x1, det.frame.y2 - det.frame.y1);
      ctx.fill('evenodd');
      const { x1, y1, x2, y2 } = det.frame;
      ctx.strokeStyle = det.locked ? GRN : CYN; ctx.lineWidth = det.locked ? 7 : 3;
      ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
      if (det.locked) {
        ctx.font = '800 26px system-ui'; ctx.fillStyle = GRN;
        ctx.fillText('FACE LOCKED', x1, Math.max(30, y1 - 12));
        const c = 24; ctx.lineWidth = 4;
        [[x1,y1,1,1],[x2,y1,-1,1],[x1,y2,1,-1],[x2,y2,-1,-1]].forEach(([cx,cy,sx,sy]) => {
          ctx.beginPath(); ctx.moveTo(cx+c*sx,cy); ctx.lineTo(cx,cy); ctx.lineTo(cx,cy+c*sy); ctx.stroke();
        });
      }
    } else {
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, H);
      ctx.font = '700 22px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.textAlign = 'center';
      ctx.fillText('dui haat diye frame banao 🔲', W / 2, H / 2);
      ctx.textAlign = 'left';
    }
  }

  function drawSigma(ctx, det, W, H, t) {
    // sigma mode: grayscale + high contrast + vignette + film grain + skeleton
    ctx.save();
    ctx.filter = 'grayscale(1) contrast(1.45) brightness(1.02)';
    ctx.drawImage(cam, 0, 0, W, H);
    ctx.restore();
    // red accent skeleton
    det.handsPx.forEach((pts) => {
      ctx.strokeStyle = RED; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      for (const [a, b] of HC) { ctx.beginPath(); ctx.moveTo(pts[a].x, pts[a].y); ctx.lineTo(pts[b].x, pts[b].y); ctx.stroke(); }
      for (let i = 0; i < pts.length; i++) {
        ctx.beginPath(); ctx.arc(pts[i].x, pts[i].y, i % 4 === 0 ? 5.5 : 3.5, 0, 7);
        ctx.fillStyle = WHT; ctx.fill();
      }
    });
    det.faces.forEach((f) => {
      ctx.strokeStyle = RED; ctx.lineWidth = 3;
      ctx.strokeRect(f.x1, f.y1, f.x2 - f.x1, f.y2 - f.y1);
    });
    // scanlines
    ctx.fillStyle = 'rgba(0,0,0,.14)';
    for (let y = (t * 2) % 4; y < H; y += 4) ctx.fillRect(0, y, W, 1.5);
    // grain
    ctx.globalAlpha = .06;
    for (let i = 0; i < 260; i++) {
      ctx.fillStyle = Math.random() > .5 ? '#fff' : '#000';
      ctx.fillRect(Math.random() * W, Math.random() * H, 2, 2);
    }
    ctx.globalAlpha = 1;
    // sigma watermark
    ctx.font = '900 30px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.fillText('Σ', 16, H - 18);
    if (det.locked) {
      ctx.font = '900 30px system-ui'; ctx.fillStyle = GOLD; ctx.textAlign = 'center';
      ctx.fillText('SIGMA LOCKED', W / 2, 52); ctx.textAlign = 'left';
    }
  }

  /* ---------------- layout / resize ---------------- */
  function fit(cv) {
    const r = cv.parentElement.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  }

  /* ---------------- main loop ---------------- */
  let running = false, busy = false, frames = 0, t0 = 0, mediaRec = null;
  async function loop() {
    if (!running) return;
    const W = cv1.width, H = cv1.height;
    if (!busy && ready === 3 && cam.videoWidth) {
      busy = true;
      try {
        await face.send({ image: cam });
        await hands.send({ image: cam });
        const det = analyze(W, H);
        // sizes
        cvs.forEach(fit);
        // 1: RAW (mirror)
        const c1 = ctxs[0];
        c1.save(); c1.translate(W, 0); c1.scale(-1, 1);
        c1.drawImage(cam, 0, 0, W, H); c1.restore();
        // 2: SKELETON
        const c2 = ctxs[1];
        c2.save(); c2.translate(W, 0); c2.scale(-1, 1);
        c2.drawImage(cam, 0, 0, W, H); c2.restore();
        drawSkeleton(c2, det, W, H);
        // 3: FRAME LOCK
        const c3 = ctxs[2]; drawFrameLock(c3, det, W, H);
        // 4: SIGMA
        const c4 = ctxs[3]; drawSigma(c4, det, W, H, performance.now() / 100);
        // lock corners on cell1+cell3
        cells[0].classList.toggle('locked', det.locked);
        cells[2].classList.toggle('locked', det.locked);
        cells[3].classList.toggle('locked', det.locked);
        // stats
        hNum.textContent = det.handsPx.length; fNum.textContent = det.faces.length;
        lockStat.innerHTML = det.locked ? '<b>🔒 FACE LOCKED</b>' : (det.frame ? 'frame…' : '🔓 searching…');
        frames++;
        const now = performance.now();
        if (now - t0 > 700) { fpsEl.textContent = Math.round(frames * 1000 / (now - t0)) + ' fps'; frames = 0; t0 = now; }
      } catch (e) { errBox.textContent = '⚠ ' + (e && e.message || e); }
      busy = false;
    }
    requestAnimationFrame(loop);
  }

  /* ---------------- start ---------------- */
  $('#bStart').onclick = async () => {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Ei browser e camera API nei — Chrome/Edge notun version use koro.');
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }, audio: false });
      cam.srcObject = stream; await cam.play();
      if (!hands) initModels();
      gate.style.display = 'none';
      running = true; t0 = performance.now();
      loop();
    } catch (e) {
      const n = e && e.name || '';
      errBox.textContent = n === 'NotAllowedError' ? 'Camera permission dan koro, tarpor page reload koro.' :
        n === 'NotFoundError' ? 'Kono camera pai nai.' : (e && e.message || String(e));
    }
  };

  /* ---------------- shot / record ---------------- */
  function shot() {
    const a = document.createElement('a');
    a.download = 'sigma_' + Date.now() + '.png';
    a.href = cvs[3].toDataURL('image/png');   // sigma pane shot
    a.click();
    const img = document.createElement('img');
    img.src = cvs[3].toDataURL('image/png');
    strip.prepend(img);
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
  }
  $('#bShot').onclick = shot;

  $('#bRec').onclick = () => {
    const stream = cvs[3].captureStream(30);
    const audioless = stream;
    if (state.mediaRec && state.recOn) {
      state.mediaRec.stop(); return;
    }
    try {
      mediaRec = new MediaRecorder(stream, { mimeType: 'video/webm' });
    } catch (e) { mediaRec = new MediaRecorder(stream); }
    state.mediaRec = mediaRec;
    const chunks = state.chunks = [];
    mediaRec.ondataavailable = (e) => chunks.push(e.data);
    mediaRec.onstop = () => {
      state.recOn = false;
      document.body.classList.remove('rec-on');
      $('#bRec').classList.remove('on'); $('#bRec').textContent = '⏺ Record (R)';
      $('#recBadge').style.display = 'none';
      const blob = new Blob(chunks, { type: 'video/webm' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'sigma_' + Date.now() + '.webm';
      a.click();
    };
    mediaRec.start();
    state.recOn = true;
    document.body.classList.add('rec-on');
    $('#bRec').classList.add('on'); $('#bRec').textContent = '⏹ Stop (R)';
    $('#recBadge').style.display = 'flex';
  };

  /* grid <-> full toggle */
  $('#bGrid').onclick = () => setSolo(0);
  $('#bSolo').onclick = () => setSolo(3);
  function setSolo(idx) {
    state.grid = (idx === -1);
    if (idx === -1) {
      cells.forEach((c) => { c.style.display = ''; });
      $('#bGrid').classList.add('on'); $('#bSolo').classList.remove('on');
    } else {
      cells.forEach((c, i) => { c.style.display = (i === idx) ? '' : 'none'; });
      $('#bGrid').classList.remove('on'); $('#bSolo').classList.add('on');
    }
  }

  addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 's') shot();
    if (k === 'r') $('#bRec').click();
    if (k === 'g') { (state.grid ? setSolo(3) : setSolo(-1)); }
  });
})();
</script>
</body>
</html>
