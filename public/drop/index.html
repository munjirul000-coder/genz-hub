<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>FlashVault BD — LIVE DROP</title>
<meta name="description" content="Live 1-hour flash drop. Claim surplus stocks at 80% off before they vanish.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090b; --bg2:#111113; --bg3:#18181b; --bg4:#1f1f23;
  --border:#27272a; --border2:#3f3f46;
  --gold:#f59e0b; --gold2:#fbbf24; --gold-dim:rgba(245,158,11,.12);
  --gold-glow:rgba(245,158,11,.35); --gold-glow2:rgba(245,158,11,.55);
  --text:#fafafa; --text2:#e4e4e7; --muted:#a1a1aa; --muted2:#71717a;
  --red:#ef4444; --green:#10b981;
  --radius:16px; --radius-lg:20px; --radius-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
img{display:block;max-width:100%}

/* TOP PINNED BAR */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(9,9,11,.92);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--border);
  height:56px;display:flex;align-items:center;
}
.topbar-inner{max-width:1280px;margin:0 auto;width:100%;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.topbar-left{display:flex;align-items:center;gap:14px}
.vault-status{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 12px;border-radius:var(--radius-pill);
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--border);background:var(--bg2);
  transition:all .4s;
}
.vault-status.locked{color:var(--muted);border-color:var(--border)}
.vault-status.locked .dot{width:8px;height:8px;border-radius:50%;background:var(--muted2);box-shadow:0 0 0 0 transparent}
.vault-status.unlocked{color:#000;background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:var(--gold);box-shadow:0 0 20px var(--gold-glow)}
.vault-status.unlocked .dot{background:#000;animation:pulseGold 1.5s infinite}
@keyframes pulseGold{0%{box-shadow:0 0 0 0 rgba(0,0,0,.4)}70%{box-shadow:0 0 0 8px rgba(0,0,0,0)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
.countdown-top{
  display:flex;align-items:center;gap:10px;
  font-family:'JetBrains Mono',monospace;
}
.countdown-top .label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)}
.countdown-top .time{
  display:flex;gap:6px;align-items:center;
}
.time-pill{
  min-width:48px;height:32px;padding:0 8px;
  background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:-.02em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.time-pill b{color:var(--text)}
.time-sep{color:var(--border2);font-weight:300}
.topbar-right{display:flex;align-items:center;gap:12px}
.live-indicator{
  display:flex;align-items:center;gap:6px;
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--muted2);
}
.live-indicator .blink{width:6px;height:6px;background:var(--red);border-radius:50%;animation:blinkLive 1s infinite}
@keyframes blinkLive{0%,50%{opacity:1}51%,100%{opacity:.2}}
.viewers{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted2)}

/* HEADER */
.header{max-width:1280px;margin:0 auto;padding:18px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-weight:800;letter-spacing:-.04em;font-size:18px}
.logo-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;box-shadow:0 0 16px var(--gold-glow)}
.logo-text span{color:var(--gold)}
.header-actions{display:flex;gap:10px;align-items:center}
.btn-sm{padding:8px 14px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:600;border:1px solid var(--border);background:var(--bg2)}
.btn-sm:hover{border-color:var(--border2);background:var(--bg3)}
.force-btn{background:var(--bg2);border:1px dashed var(--border2);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px}
.force-btn:hover{color:var(--gold2);border-color:var(--gold)}

/* MAIN */
.main{max-width:1280px;margin:0 auto;padding:20px 20px 80px}
.drop-head{margin:16px 0 24px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.drop-head h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(28px,4vw,40px);letter-spacing:-.04em;line-height:.95}
.drop-head h1 span{color:var(--gold)}
.drop-head p{color:var(--muted);font-size:14.5px;max-width:420px;line-height:1.5;margin-top:8px}
.drop-stats{display:flex;gap:12px}
.stat-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;min-width:92px}
.stat-box b{font-family:'JetBrains Mono',monospace;font-size:18px;display:block}
.stat-box span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);font-family:'JetBrains Mono',monospace}

/* PRODUCT GRID */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:1024px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid{grid-template-columns:1fr}}

.card{
  background:linear-gradient(145deg,var(--bg2),var(--bg3));
  border:1px solid var(--border);border-radius:var(--radius-lg);
  overflow:hidden;position:relative;
  transition:all .35s cubic-bezier(.22,.9,.28,1);
}
.card:hover{transform:translateY(-4px);border-color:rgba(245,158,11,.25);box-shadow:0 0 30px rgba(245,158,11,.08),0 20px 50px rgba(0,0,0,.5)}
.card.soldout{opacity:.6;pointer-events:none}
.card.soldout::after{content:'SOLD OUT';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);background:var(--red);color:#fff;font-family:'Syne',sans-serif;font-weight:800;font-size:22px;letter-spacing:.08em;padding:8px 18px;border-radius:8px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.5)}

.card-img{aspect-ratio:4/3;position:relative;overflow:hidden;background:#111}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover .card-img img{transform:scale(1.05)}
.card-badges{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;z-index:2;gap:8px}
.badge{
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.06em;
  padding:5px 9px;border-radius:var(--radius-pill);text-transform:uppercase;
}
.badge-brand{background:rgba(9,9,11,.85);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--text2)}
.badge-off{background:var(--gold);color:#000;box-shadow:0 2px 12px var(--gold-glow)}

.card-body{padding:16px}
.card-title{font-weight:600;font-size:14.5px;line-height:1.35;margin-bottom:8px;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px}
.price-row{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.price-orig{font-size:12.5px;color:var(--muted2);text-decoration:line-through}
.price-drop{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:var(--gold2)}
.price-save{font-family:'JetBrains Mono',monospace;font-size:10px;background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.25);color:var(--gold2);padding:2px 6px;border-radius:6px}

/* STOCK BAR */
.stock-wrap{margin-bottom:14px}
.stock-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-family:'JetBrains Mono',monospace;font-size:11px}
.stock-head .left{color:var(--muted2)}
.stock-head .left b{color:var(--text)}
.stock-head .right{color:var(--red);font-weight:700}
.stock-head .right.ok{color:var(--muted2)}
.stock-head .right.low{color:var(--red);animation:shake 1s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}
.stock-bar{height:8px;background:var(--bg4);border-radius:999px;overflow:hidden;position:relative;border:1px solid var(--border)}
.stock-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:999px;transition:width .8s cubic-bezier(.22,.9,.28,1);position:relative;overflow:hidden}
.stock-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-100%);animation:shimmerBar 1.8s infinite}
@keyframes shimmerBar{100%{transform:translateX(100%)}}
.stock-fill.critical{background:linear-gradient(90deg,var(--red),#f87171)}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:13px 16px;border-radius:12px;
  font-weight:700;font-size:13.5px;letter-spacing:.01em;
  transition:all .25s cubic-bezier(.22,.9,.28,1);position:relative;overflow:hidden;
}
.btn-locked{
  background:var(--bg4);color:var(--muted2);border:1px solid var(--border);
  cursor:not-allowed;
}
.btn-claim{
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;
  box-shadow:0 0 24px rgba(245,158,11,.35),0 6px 20px rgba(245,158,11,.25),inset 0 1px 0 rgba(255,255,255,.5);
  animation:glowPulse 2s infinite;
}
@keyframes glowPulse{0%{box-shadow:0 0 24px rgba(245,158,11,.35),0 6px 20px rgba(245,158,11,.25)}50%{box-shadow:0 0 36px rgba(245,158,11,.5),0 8px 28px rgba(245,158,11,.35)}100%{box-shadow:0 0 24px rgba(245,158,11,.35),0 6px 20px rgba(245,158,11,.25)}}
.btn-claim:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 0 40px rgba(245,158,11,.5),0 10px 32px rgba(245,158,11,.4)}
.btn-claim:active{transform:translateY(0) scale(.98)}
.btn-claim::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 20%,rgba(255,255,255,.5) 50%,transparent 80%);
  transform:translateX(-100%);transition:transform .6s;
}
.btn-claim:hover::after{transform:translateX(100%)}

/* UNLOCK ANIMATION */
@keyframes unlockPop{0%{transform:scale(1)}30%{transform:scale(1.2) rotate(10deg)}60%{transform:scale(.9) rotate(-10deg)}100%{transform:scale(1) rotate(0)}}
.unlock-anim{animation:unlockPop .6s cubic-bezier(.22,.9,.28,1)}

/* TOASTS */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:min(360px,92vw);pointer-events:none}
.toast{
  background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--gold);
  border-radius:12px;padding:10px 14px;font-size:13px;display:flex;align-items:center;gap:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toastIn .35s cubic-bezier(.22,.9,.28,1);
}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.toast .ico{width:28px;height:28px;border-radius:8px;background:var(--bg3);display:grid;place-items:center;flex-shrink:0}

/* MODAL */
.overlay{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.72);backdrop-filter:blur(16px);display:none;place-items:center;padding:16px}
.overlay.open{display:grid}
.modal{
  width:100%;max-width:480px;max-height:92vh;overflow-y:auto;
  background:linear-gradient(145deg,var(--bg2),var(--bg3));
  border:1px solid var(--border);border-radius:20px;
  box-shadow:0 30px 80px rgba(0,0,0,.7);
  animation:modalIn .4s cubic-bezier(.22,.9,.28,1);
}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.modal-head{padding:20px 22px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-head h3{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.02em}
.modal-head .close{width:32px;height:32px;border-radius:8px;background:var(--bg4);border:1px solid var(--border);display:grid;place-items:center}
.modal-body{padding:18px 22px 22px}
.prod-summary{display:flex;gap:12px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:12px;margin-bottom:18px}
.prod-summary img{width:64px;height:64px;border-radius:10px;object-fit:cover}
.prod-summary .info{flex:1;min-width:0}
.prod-summary .brand{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2)}
.prod-summary .title{font-weight:600;font-size:13.5px;line-height:1.3;margin:2px 0}
.prod-summary .price{font-family:'Syne',sans-serif;font-weight:800;color:var(--gold2)}

.field{margin-bottom:14px}
.label{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-family:'JetBrains Mono',monospace}
.input,.select{
  width:100%;padding:12px 14px;border-radius:10px;
  background:var(--bg);border:1px solid var(--border);color:var(--text);
  font-size:14px;outline:none;transition:border-color .2s;
}
.input:focus,.select:focus{border-color:var(--gold)}
.input::placeholder{color:var(--muted2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pay-options{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.pay-opt{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  border:1px solid var(--border);border-radius:12px;background:var(--bg);
  cursor:pointer;transition:all .2s;position:relative;
}
.pay-opt:hover{border-color:var(--border2)}
.pay-opt.on{border-color:var(--gold);background:rgba(245,158,11,.08);box-shadow:0 0 0 3px rgba(245,158,11,.12)}
.pay-opt input{accent-color:var(--gold)}
.pay-opt .pay-logo{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:11px;flex-shrink:0}
.pay-opt .pay-logo.bkash{background:#e2136e;color:#fff}
.pay-opt .pay-logo.nagad{background:#f6921e;color:#fff}
.pay-opt .pay-logo.cod{background:var(--bg3);border:1px solid var(--border);color:var(--muted)}
.pay-opt .pay-meta{flex:1}
.pay-opt .pay-meta b{font-size:13px;display:block}
.pay-opt .pay-meta span{font-size:11px;color:var(--muted2)}
.pay-opt .pay-fee{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted2)}
.pay-opt.on .pay-fee{color:var(--gold2)}

.summary{
  background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;margin:16px 0;
  font-size:13px;
}
.summary .line{display:flex;justify-content:space-between;padding:5px 0}
.summary .line.total{border-top:1px solid var(--border);margin-top:6px;padding-top:10px;font-weight:800;font-size:15px}
.summary .line.total b{color:var(--gold2);font-family:'Syne',sans-serif}
.btn-confirm{
  width:100%;padding:15px;border-radius:12px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;
  font-weight:800;font-size:14.5px;letter-spacing:.01em;
  box-shadow:0 0 24px rgba(245,158,11,.35);
  transition:all .2s;
}
.btn-confirm:hover{transform:translateY(-1px);box-shadow:0 0 32px rgba(245,158,11,.45)}
.btn-confirm:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* PROCESSING */
.processing{text-align:center;padding:30px 20px}
.processing .bkash-anim{
  width:80px;height:80px;margin:0 auto 18px;border-radius:20px;
  background:#e2136e;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;
  box-shadow:0 0 30px rgba(226,19,110,.4);animation:pulseBkash 1.2s infinite;
}
@keyframes pulseBkash{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.processing h4{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;margin-bottom:6px}
.processing p{color:var(--muted);font-size:13px;margin-bottom:16px}
.steps{display:flex;flex-direction:column;gap:8px;max-width:280px;margin:0 auto 20px;text-align:left}
.step{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted2)}
.step .circle{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;font-size:10px;flex-shrink:0}
.step.done{color:var(--text)}
.step.done .circle{background:var(--green);border-color:var(--green);color:#fff}
.step.active{color:var(--gold2)}
.step.active .circle{border-color:var(--gold);color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:4px;background:var(--bg4);border-radius:999px;overflow:hidden;max-width:280px;margin:0 auto}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0;transition:width .4s}

/* SUCCESS */
.success{text-align:center;padding:24px 20px}
.success .check{
  width:72px;height:72px;margin:0 auto 16px;border-radius:50%;
  background:linear-gradient(135deg,var(--green),#059669);display:grid;place-items:center;color:#fff;font-size:32px;
  box-shadow:0 0 30px rgba(16,185,129,.35);
}
.success h3{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;margin-bottom:6px}
.success .order-id{
  font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.08em;
  background:var(--bg);border:1px dashed var(--border2);padding:8px 12px;border-radius:8px;
  display:inline-block;margin:10px 0 16px;color:var(--gold2);
}
.success .receipt{
  text-align:left;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;margin:16px 0;
  font-size:13px;
}
.success .btns{display:flex;gap:10px;margin-top:16px}
.success .btns .btn{flex:1}
</style>
</head>

  <div class="topbar-inner">
    <div class="topbar-left">
      <div class="vault-status locked" id="vaultStatus"><span class="dot"></span><span id="vaultText">VAULT LOCKED</span></div>
      <div class="countdown-top" id="countdownTop">

</div>

<header class="header">

</header>

<main class="main">
  <div class="drop-head">

  </div>

<script>
const PRODUCTS = [
  {id:1, brand:"Gorur Ghash Surplus", title:"Heavyweight Hoodie - Jet Black 320GSM", orig:2500, drop:650, total:20, left:14, img:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=600&q=80"},
  {id:2, brand:"Fabrilife Lot", title:"Premium Drop-Shoulder Tee - Off-White", orig:1200, drop:350, total:50, left:38, img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600&q=80"},
  {id:3, brand:"Export Surplus", title:"Varsity Coach Jacket - Limited", orig:3800, drop:890, total:15, left:6, img:"https://images.unsplash.com/photo-1594938298603-c8148c4dae35?w=600&q=80"},
  {id:4, brand:"Yellow Surplus", title:"Cargo Pants - Olive Green 6-Pocket", orig:2200, drop:580, total:25, left:18, img:"https://images.unsplash.com/photo-1473966968600-fa801b869a1a?w=600&q=80"},
  {id:5, brand:"Aarong Deadstock", title:"Linen Kurta - Sand Beige Handloom", orig:1800, drop:490, total:12, left:3, img:"https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=600&q=80"},
  {id:6, brand:"Dorjibari Lot", title:"Oversized Shirt - Washed Denim Blue", orig:1600, drop:420, total:30, left:22, img:"https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=600&q=80"},
];

let isUnlocked = false;
let claimedCount = 0;
let activeProduct = null;
let paymentMethod = 'bkash';
let city = 'dhaka';

function getNextFriday9PM(){
  const now=new Date();
  const target=new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 15,0,0,0));
  const day=target.getUTCDay();
  const diff=(5-day+7)%7;
  target.setUTCDate(target.getUTCDate()+diff);
  if(target<=now) target.setUTCDate(target.getUTCDate()+7);
  return target;
}
let targetDate = getNextFriday9PM();
const params = new URLSearchParams(location.search);
if(params.get('force')==='unlock' || params.get('demo')==='live' || params.get('unlock')==='1'){
  isUnlocked = true;
}

function formatBDT(n){return 'BDT '+n.toLocaleString('en-BD')}

function renderGrid(){
  const grid=document.getElementById('grid');
  grid.innerHTML = PRODUCTS.map(p=>{
    const pct = Math.round(((p.orig-p.drop)/p.orig)*100);
    const stockPct = Math.round((p.left/p.total)*100);
    const isLow = p.left<=5;
    const isCritical = p.left<=3;
    const soldout = p.left<=0;
    return `
    <div class="card ${soldout?'soldout':''}" data-id="${p.id}">
      <div class="card-img">
        <img src="${p.img}" alt="${p.title}" loading="lazy">
        <div class="card-badges">
          <span class="badge badge-brand">${p.brand}</span>
          <span class="badge badge-off">${pct}% OFF</span>
        </div>
      </div>
      <div class="card-body">
        <div class="card-title">${p.title}</div>
        <div class="price-row">
          <span class="price-orig">${formatBDT(p.orig)}</span>
          <span class="price-drop">${formatBDT(p.drop)}</span>
          <span class="price-save">Save ${formatBDT(p.orig-p.drop)}</span>
        </div>
        <div class="stock-wrap">
          <div class="stock-head">
            <span class="left">Only <b>${p.left}</b> left out of ${p.total}</span>
            <span class="right ${isLow?'low':''} ${!isLow?'ok':''}">${isLow? (isCritical?'⚠️ CRITICAL':'🔥 LOW') : '● IN STOCK'}</span>
          </div>
          <div class="stock-bar"><div class="stock-fill ${isCritical?'critical':''}" style="width:${stockPct}%"></div></div>
        </div>
        ${isUnlocked ? `
          <button class="btn btn-claim" onclick="openCheckout(${p.id})">⚡ CLAIM NOW</button>
        ` : `
          <button class="btn btn-locked" disabled><span>🔒</span> Unlocks at 09:00 PM</button>
        `}
      </div>
    </div>`;
  }).join('');
  updateStats();
}

function updateStats(){
  const totalLeft = PRODUCTS.reduce((s,p)=>s+p.left,0);
  const total = PRODUCTS.reduce((s,p)=>s+p.total,0);
  document.getElementById('statTotal').textContent = PRODUCTS.length;
  document.getElementById('statLeft').textContent = totalLeft;
  document.getElementById('statClaimed').textContent = claimedCount;
  document.getElementById('viewers').textContent = `🔥 ${Math.floor(1200+Math.random()*400)} watching`;
}

function updateCountdown(){
  const now=new Date();
  let diff = targetDate - now;
  if(diff<=0 && !isUnlocked){
    unlockVault();
    return;
  }
  if(isUnlocked){
    document.getElementById('th').textContent='00';
    document.getElementById('tm').textContent='00';
    document.getElementById('ts').textContent='00';
    return;
  }
  const totalSec=Math.floor(diff/1000);
  const h=Math.floor(totalSec/3600);
  const m=Math.floor((totalSec%3600)/60);
  const s=totalSec%60;
  document.getElementById('th').textContent=String(h).padStart(2,'0');
  document.getElementById('tm').textContent=String(m).padStart(2,'0');
  document.getElementById('ts').textContent=String(s).padStart(2,'0');
}

function unlockVault(){
  if(isUnlocked) return;
  isUnlocked=true;
  const status=document.getElementById('vaultStatus');
  status.classList.remove('locked');status.classList.add('unlocked');
  status.querySelector('#vaultText').textContent='VAULT UNLOCKED';
  status.classList.add('unlock-anim');
  document.querySelector('.countdown-top .label').textContent='Live for';
  // confetti effect via framer motion
  if(window.Motion){
    Motion.animate(status,{scale:[1,1.1,1]},{duration:.5});
  }
  // unlock animation for buttons
  renderGrid();
  document.querySelectorAll('.card').forEach((card,i)=>{
    setTimeout(()=>{
      card.style.transform='scale(1.03)';
      setTimeout(()=>card.style.transform='',200);
    }, i*80);
  });
  toast('⚡ VAULT UNLOCKED! Claim now before stock vanishes!','🔓');
  // start stock FOMO faster after unlock
  startFomo();
}

function toast(msg,ico='🔥'){
  const box=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast';
  el.innerHTML=`<div class="ico">${ico}</div><div>${msg}</div>`;
  box.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(8px)';setTimeout(()=>el.remove(),300)},3500);
}

// FOMO stock decreasing
let fomoInterval;
function startFomo(){
  if(fomoInterval) clearInterval(fomoInterval);
  fomoInterval=setInterval(()=>{
    if(!isUnlocked) return;
    const available = PRODUCTS.filter(p=>p.left>0);
    if(!available.length) return;
    const p = available[Math.floor(Math.random()*available.length)];
    if(Math.random()<0.7){ // 70% chance to decrease
      p.left = Math.max(0,p.left-1);
      if(p.left===0) toast(`💀 ${p.title} just SOLD OUT!`,'💀');
      else if(p.left<=3) toast(`⚠️ Only ${p.left} left: ${p.title}`,'⚠️');
      else if(Math.random()<0.4) toast(`🔥 Someone claimed ${p.brand}`,'🛒');
      renderGrid();
    }
  }, 1800);
}
function startPreFomo(){
  // slower FOMO before unlock to build urgency
  setInterval(()=>{
    if(isUnlocked) return;
    if(Math.random()<0.3){
      const p=PRODUCTS[Math.floor(Math.random()*PRODUCTS.length)];
      toast(`👀 ${Math.floor(5+Math.random()*20)} people watching ${p.brand}`,'👁️');
    }
  }, 4000);
}

// Checkout
function openCheckout(id){
  if(!isUnlocked) return;
  activeProduct = PRODUCTS.find(p=>p.id===id);
  if(!activeProduct || activeProduct.left<=0) return;
  paymentMethod='bkash';
  city='dhaka';
  renderCheckoutForm();
  document.getElementById('checkoutOverlay').classList.add('open');
}
function closeCheckout(){
  document.getElementById('checkoutOverlay').classList.remove('open');
}
function renderCheckoutForm(){
  const p=activeProduct;
  const delivery = city==='dhaka'?60:120;
  const escrow = paymentMethod==='cod'?100:0;
  const total = p.drop + delivery + escrow;
  const modal=document.getElementById('checkoutModal');
  modal.innerHTML=`
    <div class="modal-head">
      <div><h3>Light-Speed Checkout</h3><div style="font-family:'JetBrains Mono';font-size:11px;color:var(--muted2);margin-top:4px">⚡ 1-CLICK • Escrow Protected • 48h Delivery</div></div>
      <button class="close" onclick="closeCheckout()">✕</button>
    </div>
    <div class="modal-body">
      <div class="prod-summary">
        <img src="${p.img}" alt="">
        <div class="info">
          <div class="brand">${p.brand}</div>
          <div class="title">${p.title}</div>
          <div class="price">${formatBDT(p.drop)} <span style="font-size:11px;color:var(--muted2);text-decoration:line-through">${formatBDT(p.orig)}</span></div>
        </div>
      </div>

      <div class="field"><label class="label">Full Name</label><input class="input" id="cName" placeholder="e.g. Rahim Ahmed"></div>
      <div class="field"><label class="label">Phone Number (bKash/Nagad)</label><input class="input" id="cPhone" placeholder="01XXXXXXXXX"></div>
      <div class="field"><label class="label">Delivery Address</label><input class="input" id="cAddr" placeholder="House, Road, Area"></div>
      <div class="row2">
        <div class="field"><label class="label">City</label>
          <select class="select" id="cCity" onchange="onCityChange(this.value)">
            <option value="dhaka" ${city==='dhaka'?'selected':''}>Dhaka (60 BDT)</option>
            <option value="outside" ${city==='outside'?'selected':''}>Outside Dhaka (120 BDT)</option>
          </select>
        </div>
        <div class="field"><label class="label">Quantity</label><select class="select" id="cQty"><option>1 pcs</option></select></div>
      </div>

      <label class="label" style="margin-top:8px">Payment Method</label>
      <div class="pay-options">
        <label class="pay-opt ${paymentMethod==='bkash'?'on':''}" onclick="setPay('bkash')">
          <input type="radio" name="pay" ${paymentMethod==='bkash'?'checked':''}><div class="pay-logo bkash">bKash</div><div class="pay-meta"><b>bKash</b><span>Instant • Most popular • 0% fee</span></div><span class="pay-fee">FREE</span>
        </label>
        <label class="pay-opt ${paymentMethod==='nagad'?'on':''}" onclick="setPay('nagad')">
          <input type="radio" name="pay" ${paymentMethod==='nagad'?'checked':''}><div class="pay-logo nagad">Nagad</div><div class="pay-meta"><b>Nagad</b><span>Fast • Secure</span></div><span class="pay-fee">FREE</span>
        </label>
        <label class="pay-opt ${paymentMethod==='cod'?'on':''}" onclick="setPay('cod')">
          <input type="radio" name="pay" ${paymentMethod==='cod'?'checked':''}><div class="pay-logo cod">COD</div><div class="pay-meta"><b>Cash on Delivery</b><span>Pay on arrival + 100 BDT Escrow Lock</span></div><span class="pay-fee">+100 BDT</span>
        </label>
      </div>

      <div class="summary">
        <div class="line"><span>Item Price</span><span>${formatBDT(p.drop)}</span></div>
        <div class="line"><span>Delivery Fee (${city==='dhaka'?'Dhaka':'Outside'})</span><span>${formatBDT(delivery)}</span></div>
        ${escrow?`<div class="line"><span>Escrow Lock Fee (COD)</span><span>${formatBDT(escrow)}</span></div>`:''}
        <div class="line"><span>Platform Fee</span><span style="color:var(--green)">0 BDT</span></div>
        <div class="line total"><span>Total Pay</span><b>${formatBDT(total)}</b></div>
      </div>

      <button class="btn-confirm" id="confirmBtn" onclick="confirmOrder()">Confirm & Pay via ${paymentMethod==='bkash'?'bKash':paymentMethod==='nagad'?'Nagad':'COD'} — ${formatBDT(total)} →</button>
      <div style="text-align:center;margin-top:10px;font-family:'JetBrains Mono';font-size:10px;color:var(--muted2)">🔒 100% Anti-Scam Escrow • Funds held until delivery • No returns on flash sale</div>
      <div id="formErr" style="display:none;margin-top:10px;padding:10px;border-radius:8px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#fca5a5;font-size:13px"></div>
    </div>
  `;
}
function setPay(m){paymentMethod=m;renderCheckoutForm()}
function onCityChange(v){city=v;renderCheckoutForm()}

function confirmOrder(){
  const name=document.getElementById('cName').value.trim();
  const phone=document.getElementById('cPhone').value.trim();
  const addr=document.getElementById('cAddr').value.trim();
  const err=document.getElementById('formErr');
  if(!name || name.length<3){err.style.display='block';err.textContent='Please enter your full name (min 3 chars).';return}
  if(!phone || !/^01[0-9]{9}$/.test(phone)){err.style.display='block';err.textContent='Please enter valid BD phone: 01XXXXXXXXX';return}
  if(!addr || addr.length<6){err.style.display='block';err.textContent='Please enter delivery address.';return}
  // processing
  renderProcessing();
}

function renderProcessing(){
  const modal=document.getElementById('checkoutModal');
  const p=activeProduct;
  const delivery=city==='dhaka'?60:120;
  const escrow=paymentMethod==='cod'?100:0;
  const total=p.drop+delivery+escrow;
  modal.innerHTML=`
    <div class="processing">
      <div class="bkash-anim">${paymentMethod==='bkash'?'bK':paymentMethod==='nagad'?'N':'COD'}</div>
      <h4>Processing Payment...</h4>
      <p>Please don't close this window. Securing your claim via escrow.</p>
      <div class="steps" id="procSteps">
        <div class="step active" id="s1"><span class="circle">1</span> Initiating ${paymentMethod.toUpperCase()} payment</div>
        <div class="step" id="s2"><span class="circle">2</span> Verifying phone & stock</div>
        <div class="step" id="s3"><span class="circle">3</span> Locking inventory & generating receipt</div>
      </div>
      <div class="progress"><i id="progBar" style="width:0%"></i></div>
      <div style="margin-top:12px;font-family:'JetBrains Mono';font-size:11px;color:var(--muted2)" id="procText">Connecting to bKash gateway...</div>
    </div>
  `;
  let step=1;
  const bar=document.getElementById('progBar');
  const texts=['Connecting to bKash gateway...','Verifying 01XXXX...','Reserving item from vault...','Finalizing escrow...'];
  const interval=setInterval(()=>{
    bar.style.width=(step*33)+'%';
    document.getElementById('procText').textContent=texts[step-1]||'Finalizing...';
    if(step===1){document.getElementById('s1').classList.remove('active');document.getElementById('s1').classList.add('done');document.getElementById('s1').querySelector('.circle').textContent='✓';document.getElementById('s2').classList.add('active')}
    else if(step===2){document.getElementById('s2').classList.remove('active');document.getElementById('s2').classList.add('done');document.getElementById('s2').querySelector('.circle').textContent='✓';document.getElementById('s3').classList.add('active')}
    else if(step===3){
      document.getElementById('s3').classList.remove('active');document.getElementById('s3').classList.add('done');document.getElementById('s3').querySelector('.circle').textContent='✓';
      bar.style.width='100%';
      clearInterval(interval);
      setTimeout(()=>renderSuccess(),600);
    }
    step++;
  },900);
}

function renderSuccess(){
  const p=activeProduct;
  const delivery=city==='dhaka'?60:120;
  const escrow=paymentMethod==='cod'?100:0;
  const total=p.drop+delivery+escrow;
  const orderId='FV-'+Math.floor(100000+Math.random()*900000);
  // decrease stock
  p.left=Math.max(0,p.left-1);
  claimedCount++;
  renderGrid();
  const modal=document.getElementById('checkoutModal');
  modal.innerHTML=`
    <div class="success">
      <div class="check">✓</div>
      <h3>Claim Confirmed!</h3>
      <p style="color:var(--muted);font-size:13.5px">Your item is locked. Escrow secured. Delivery in 48h.</p>
      <div class="order-id">${orderId}</div>
      <div class="receipt">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>${p.title}</b><span>${formatBDT(p.drop)}</span></div>
        <div style="display:flex;justify-content:space-between;color:var(--muted2);font-size:12px"><span>Delivery (${city})</span><span>${formatBDT(delivery)}</span></div>
        ${escrow?`<div style="display:flex;justify-content:space-between;color:var(--muted2);font-size:12px"><span>Escrow Lock</span><span>${formatBDT(escrow)}</span></div>`:''}
        <div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-weight:800"><span>Total Paid via ${paymentMethod.toUpperCase()}</span><span style="color:var(--gold2)">${formatBDT(total)}</span></div>
        <div style="margin-top:10px;padding:8px;background:var(--bg2);border-radius:8px;font-family:'JetBrains Mono';font-size:11px;color:var(--muted2)">📦 Track: ${orderId} • bKash TrxID: ${'TRX'+Math.random().toString(36).substr(2,8).toUpperCase()} • Escrow: ACTIVE</div>
      </div>
      <div class="btns">
        <button class="btn" style="background:var(--bg4);border:1px solid var(--border)" onclick="closeCheckout()">Continue Shopping</button>
        <button class="btn" style="background:var(--text);color:var(--bg)" onclick="trackOrder('${orderId}')">Track Order →</button>
      </div>
      <div style="margin-top:14px;font-size:11px;color:var(--muted2);font-family:'JetBrains Mono'">🔒 Funds held in FlashVault escrow until you confirm delivery. No scam, no risk.</div>
    </div>
  `;
  toast(`🎉 Order ${orderId} confirmed! ${p.title} is yours!`,'✅');
  // save order
  const orders=JSON.parse(localStorage.getItem('fv_orders')||'[]');
  orders.push({orderId, product:p.title, brand:p.brand, total, payment:paymentMethod, city, at:Date.now()});
  localStorage.setItem('fv_orders',JSON.stringify(orders));
}

function trackOrder(id){
  alert(`Tracking ${id}\n\nStatus: RESERVED → PACKING → SHIPPED (Tomorrow 10 AM)\nCourier: Pathao Express\nEscrow: Funds locked until delivery confirmation.\n\nYou will get SMS updates.`);
  closeCheckout();
}

// Init
renderGrid();
updateCountdown();
setInterval(updateCountdown,1000);
startPreFomo();
if(isUnlocked){unlockVault()} else {startFomo()}

document.getElementById('forceBtn').onclick=()=>{
  if(isUnlocked){location.href='/drop';return}
  targetDate=new Date(Date.now()-1000);
  unlockVault();
  document.getElementById('forceBtn').textContent='↺ Reset to Locked';
};
document.getElementById('checkoutOverlay').onclick=(e)=>{if(e.target.id==='checkoutOverlay') closeCheckout()};
</script>
</body>
</html>
